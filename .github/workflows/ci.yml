name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  dotnet:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "10.0.x"
      - name: Restore
        run: dotnet restore
      - name: Build
        run: dotnet build --no-restore --configuration Release
      - name: Test
        # Category=Integration tests need real SQL Server instances — see the dotnet-integration job
        # below, which stands two up as service containers (architecture/implementation/phase-7-e2e-validation.md).
        run: dotnet test --no-build --configuration Release --filter "Category!=Integration"

  dotnet-integration:
    runs-on: ubuntu-latest
    services:
      mssql-source:
        image: mcr.microsoft.com/mssql/server:2022-latest
        env:
          ACCEPT_EULA: "Y"
          MSSQL_PID: Developer
          MSSQL_SA_PASSWORD: DataSync_Test_Pw1
        ports:
          - 14330:1433
        options: >-
          --health-cmd "/opt/mssql-tools18/bin/sqlcmd -C -S localhost -U sa -P DataSync_Test_Pw1 -Q 'SELECT 1' || /opt/mssql-tools/bin/sqlcmd -S localhost -U sa -P DataSync_Test_Pw1 -Q 'SELECT 1'"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 10
      mssql-target:
        image: mcr.microsoft.com/mssql/server:2022-latest
        env:
          ACCEPT_EULA: "Y"
          MSSQL_PID: Developer
          MSSQL_SA_PASSWORD: DataSync_Test_Pw1
        ports:
          - 14331:1433
        options: >-
          --health-cmd "/opt/mssql-tools18/bin/sqlcmd -C -S localhost -U sa -P DataSync_Test_Pw1 -Q 'SELECT 1' || /opt/mssql-tools/bin/sqlcmd -S localhost -U sa -P DataSync_Test_Pw1 -Q 'SELECT 1'"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "10.0.x"
      - name: Restore
        run: dotnet restore
      - name: Build
        run: dotnet build --no-restore --configuration Release
      - name: Test (Integration)
        # Same two-container topology as docker-compose.yml (source: 14330, target: 14331) so the
        # tests' localhost-based defaults work unchanged in CI.
        run: dotnet test --no-build --configuration Release --filter "Category=Integration"

  web:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: src/DataSync.Web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: "npm"
          cache-dependency-path: src/DataSync.Web/package-lock.json
      - name: Install
        run: npm ci
      - name: Build
        run: npm run build
