name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  dotnet:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "10.0.x"
      - name: Restore
        run: dotnet restore
      - name: Build
        run: dotnet build --no-restore --configuration Release
      - name: Test
        # Excludes DataSync.Drivers.MsSql.Tests' Category=Integration tests, which need a real SQL
        # Server instance (see architecture/implementation/phase-3-mssql-driver.md). Standing one up
        # in CI is a Phase 7 (end-to-end validation) concern.
        run: dotnet test --no-build --configuration Release --filter "Category!=Integration"

  web:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: src/DataSync.Web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: "npm"
          cache-dependency-path: src/DataSync.Web/package-lock.json
      - name: Install
        run: npm ci
      - name: Build
        run: npm run build
