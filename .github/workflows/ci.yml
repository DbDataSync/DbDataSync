name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  dotnet:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "10.0.x"
      - name: Restore
        run: dotnet restore
      - name: Build
        run: dotnet build --no-restore --configuration Release
      - name: Test
        # Category=Integration tests need real SQL Server instances — see the dotnet-integration job
        # below, which stands two up as service containers (architecture/implementation/phase-7-e2e-validation.md).
        run: dotnet test --no-build --configuration Release --filter "Category!=Integration"

  dotnet-integration:
    runs-on: ubuntu-latest
    services:
      mssql-source:
        image: mcr.microsoft.com/mssql/server:2022-latest
        env:
          ACCEPT_EULA: "Y"
          MSSQL_PID: Developer
          MSSQL_SA_PASSWORD: DbDataSync_Test_Pw1
          # CDC captures through a SQL Server Agent job — see docker-compose.yml.
          MSSQL_AGENT_ENABLED: "true"
        ports:
          - 14330:1433
        options: >-
          --health-cmd "/opt/mssql-tools18/bin/sqlcmd -C -S localhost -U sa -P DbDataSync_Test_Pw1 -Q 'SELECT 1' || /opt/mssql-tools/bin/sqlcmd -S localhost -U sa -P DbDataSync_Test_Pw1 -Q 'SELECT 1'"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 10
      mssql-target:
        image: mcr.microsoft.com/mssql/server:2022-latest
        env:
          ACCEPT_EULA: "Y"
          MSSQL_PID: Developer
          MSSQL_SA_PASSWORD: DbDataSync_Test_Pw1
        ports:
          - 14331:1433
        options: >-
          --health-cmd "/opt/mssql-tools18/bin/sqlcmd -C -S localhost -U sa -P DbDataSync_Test_Pw1 -Q 'SELECT 1' || /opt/mssql-tools/bin/sqlcmd -S localhost -U sa -P DbDataSync_Test_Pw1 -Q 'SELECT 1'"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 10
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_PASSWORD: DbDataSync_Test_Pw1
          POSTGRES_USER: dbdatasync
          POSTGRES_DB: dbdatasync
        ports:
          - 15432:5432
        options: >-
          --health-cmd "pg_isready -U dbdatasync"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "10.0.x"
      - name: Restore
        run: dotnet restore
      - name: Build
        run: dotnet build --no-restore --configuration Release
      - name: Test (Integration)
        # Same two-container topology as docker-compose.yml (source: 14330, target: 14331) so the
        # tests' localhost-based defaults work unchanged in CI.
        run: dotnet test --no-build --configuration Release --filter "Category=Integration"

  web:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: src/DbDataSync.Web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: "npm"
          cache-dependency-path: src/DbDataSync.Web/package-lock.json
      - name: Install
        run: npm ci
      - name: Build
        run: npm run build

  # The Playwright E2E suite. Not running it anywhere but a developer's machine is what let
  # apply-button-does-not-cache-provisioned-columns.md's golden-path test 18 sit failing on main from
  # phase 94 until somebody happened to run it (architecture/planning/done/playwright-suite-in-ci.md).
  playwright:
    runs-on: ubuntu-latest
    # docker-compose.yml rather than `services:` above, which is otherwise the same three containers on
    # the same three ports. The suite's tests/DbDataSync.Web.Tests/test-db.ts reaches SQL Server by
    # `docker exec dbdatasync-mssql-source sqlcmd ...` — by container *name*, not through a published
    # port — and service containers are named by the runner, so nothing the suite runs would find them.
    # Compose's container_name is what makes that name exist, and it is the same file the suite is
    # already written against locally, so CI runs the topology unchanged rather than a lookalike.
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "10.0.x"
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: "npm"
          cache-dependency-path: |
            src/DbDataSync.Web/package-lock.json
            tests/DbDataSync.Web.Tests/package-lock.json
      - name: Start the databases
        # --wait blocks on the healthchecks docker-compose.yml already declares, so the suite never
        # opens a connection to a SQL Server that is still coming up.
        run: docker compose up -d --wait mssql-source mssql-target postgres
      - name: Build the API
        # Debug, deliberately: playwright.config.ts's webServer runs
        # src/DbDataSync.Api/bin/Debug/net10.0/DbDataSync.Api.dll through `dotnet exec`, so a Release
        # build would leave that path empty and the API would never start.
        run: dotnet build src/DbDataSync.Api
      - name: Install the SPA's dependencies
        working-directory: src/DbDataSync.Web
        run: npm ci
      - name: Install the suite's dependencies
        # Its own package.json — @playwright/test lives here, not in the SPA's tree.
        working-directory: tests/DbDataSync.Web.Tests
        run: npm ci
      - name: Install Chromium
        # The browser binary is not part of npm ci, and the runner has no usable one pre-installed.
        working-directory: tests/DbDataSync.Web.Tests
        run: npx playwright install --with-deps chromium
      - name: Test (Playwright)
        # The config's webServer array starts and stops both the API and the SPA dev server, and
        # globalSetup/globalTeardown build and drop the test database — nothing to orchestrate here.
        working-directory: tests/DbDataSync.Web.Tests
        run: npx playwright test
      - name: Upload traces and screenshots from a failed run
        # trace: 'retain-on-failure' is already on; without this the trace of a CI-only failure is
        # thrown away with the runner, which is the one case it exists for.
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-failure-artifacts
          path: tests/DbDataSync.Web.Tests/test-results/
          retention-days: 7

  # Built on every push rather than only at release time, because the first time anyone finds out the
  # Dockerfile or the tool package is broken should not be the release.
  package:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "10.0.x"
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Pack the global tool
        run: dotnet pack src/DbDataSync.Cli/DbDataSync.Cli.csproj -c Release -o artifacts
      - name: Install it into a clean tool root and run it
        run: |
          dotnet tool install --tool-path /tmp/dbdatasync-tool --add-source artifacts DbDataSync
          /tmp/dbdatasync-tool/dbdatasync version
          /tmp/dbdatasync-tool/dbdatasync --help
      - name: Build the container image
        run: docker build -t dbdatasync:ci .
      - name: Start it and check it answers
        run: |
          docker run -d --name dbdatasync-ci -p 18080:8080 dbdatasync:ci
          for i in $(seq 1 30); do
            if docker exec dbdatasync-ci dotnet /app/DbDataSync.Cli.dll health --url http://127.0.0.1:8080; then
              exit 0
            fi
            sleep 2
          done
          echo "the container never became healthy"
          docker logs dbdatasync-ci
          exit 1
      - name: Upload the tool package
        uses: actions/upload-artifact@v4
        with:
          name: dbdatasync-tool
          path: artifacts/*.nupkg
