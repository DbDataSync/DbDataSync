name: Release

# A separate workflow from ci.yml because the trigger and the purpose are different: ci.yml proves
# every push builds, this one publishes one. Ordinary pushes to main are untouched: ci.yml's package
# job still packs and artifact-uploads exactly as it did before.
#
# Manually run from the Actions tab (or `gh workflow run release.yml`), not triggered by a pushed
# tag — that was this workflow's original shape (phase 78), abandoned once actually operating it
# showed its real cost: getting phase 127's Trusted Publishing pipeline working took five iterations,
# each needing the previous release/v* tag deleted and recreated by hand before a retry could even
# start, because the tag was the trigger and the version. Nothing here computes a version from that
# tag any more; the run itself creates and pushes the real release tag once the version it computed
# is confirmed live (see "Tag this commit," below) — the tag becomes a record of what shipped, not an
# advance guess of what might.
on:
  workflow_dispatch:
    inputs:
      beta:
        description: >-
          Publish as a prerelease (-beta suffix). nuget.org then hides it from a plain
          `dotnet tool install` — only an exact --version, or --prerelease, finds it.
        type: boolean
        default: false

# gh release create writes to the repo, and so does pushing the tag this run creates for itself
# ("Tag this commit," below) — actions/checkout@v4's default persist-credentials leaves the
# GITHUB_TOKEN wired into the checkout's own git config for the rest of the job, so a plain
# `git push` needs nothing further as long as this scope covers it.
permissions:
  contents: write
  # Lets this job request a short-lived OIDC token identifying this exact repo + workflow file, which
  # NuGet/login exchanges for a one-hour, single-use nuget.org API key (phase 127's Trusted
  # Publishing) — no long-lived NuGet secret is stored anywhere. Required for that step to work at
  # all; its absence fails the token request silently rather than with a clear error, so it's listed
  # here even though nothing above it used to need more than `contents`.
  id-token: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "10.0.x"

      # The shipped version is computed here, from the clock — not typed by a human anywhere.
      # YYYY.MM.DD.HHmm in UTC, which is a valid four-part assembly version (every part is well under
      # the 65534 ceiling) and sorts as a NuGet version in the same order it was released in.
      #
      # Whether this is a prerelease is the one thing the operator *does* still choose, via the
      # `beta` checkbox on the manual run (the dispatch UI, or `gh workflow run release.yml -f
      # beta=true`) — appends a `-beta` SemVer 2 prerelease label, which nuget.org then correctly
      # hides from a plain `dotnet tool install` (only `--prerelease`, or an exact `--version`, finds
      # it). That matters the moment a real public feed is on the other end of this workflow rather
      # than only a GitHub Release asset.
      #
      # Normalized here, before it ever reaches MSBuild — not left zero-padded and reconciled later.
      # `date`'s own %m/%d/%H%M are always zero-padded (2026.09.11.0421), but NuGet strips a leading
      # zero from every dot-separated numeric component of a version core (2026.9.11.421 — the pack
      # step's own comment already documents this). AssemblyInformationalVersionAttribute, unlike the
      # package version, is just a raw echo of whatever -p:Version was actually given — it does *not*
      # go through NuGet's normalization, so a zero-padded input here means the assembly's own
      # reported version and the nupkg's version disagree downstream, in string form, forever
      # (`$((10#$part))` forces base-10 rather than bash's own octal interpretation of a leading zero,
      # which would otherwise reject "09" outright as an invalid octal digit).
      - name: Compute the version
        id: version
        env:
          BETA: ${{ inputs.beta }}
        run: |
          IFS=. read -r y m d hm <<< "$(date -u +%Y.%m.%d.%H%M)"
          version="$((10#$y)).$((10#$m)).$((10#$d)).$((10#$hm))"
          prerelease=false
          if [ "$BETA" = "true" ]; then
            version="${version}-beta"
            prerelease=true
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "prerelease=$prerelease" >> "$GITHUB_OUTPUT"

      # -p:Version is a global MSBuild property, so it overrides the csproj's development default
      # rather than colliding with it.
      # NuGet normalizes the version it is handed — leading zeros are stripped, so a 2026.09.01.1805
      # asked for on the command line ships as 2026.9.1.1805, and that shorter string is what the
      # package, the filename and `dbdatasync version` all report. Rather than reimplement those
      # normalization rules here and risk drifting from them, the shipped version is read back off
      # the filename NuGet chose. That is what the title, the notes and the check below then use.
      - name: Pack the global tool
        id: pack
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          dotnet pack src/DbDataSync.Cli/DbDataSync.Cli.csproj \
            -c Release -o artifacts \
            -p:Version="$VERSION"

          # DbDataSync.Cli references DbDataSync.Drivers.Abstractions, which has had its own
          # GeneratePackageOnBuild=true since phase 109e (for a future third-party compiled IDriver
          # plugin to reference) — and -o/-p:Version on the command line become global MSBuild
          # properties applying to the *whole* build graph, not just the top-level project, so packing
          # the Cli quietly packs Abstractions too, into the same -o directory. A bare
          # `DbDataSync.*.nupkg` glob matches both filenames (<PackageId>.<Version>.nupkg, and both ids
          # start with "DbDataSync."), which is exactly how this was caught: the first real tag push
          # this repo ever made picked the wrong one. Anchored to a digit right after the id — a
          # version always starts with one, "Drivers" never does — the narrowest fix that leaves
          # Abstractions' own packing (deliberate, not this phase's to touch) alone. The exact resolved
          # path is captured once here and reused by every later step, rather than re-globbing and
          # risking the same ambiguity a second time.
          nupkg=$(ls artifacts/DbDataSync.[0-9]*.nupkg)
          shipped=$(basename "$nupkg" .nupkg)
          shipped=${shipped#DbDataSync.}
          echo "asked for $VERSION, NuGet shipped $shipped ($nupkg)"
          echo "shipped=$shipped" >> "$GITHUB_OUTPUT"
          echo "nupkg=$nupkg" >> "$GITHUB_OUTPUT"

      # The same smoke test ci.yml's package job runs, repeated here deliberately: a release is
      # public and awkward to withdraw, so the package proves it installs and runs before it is
      # published rather than after. It also confirms the computed version actually reached the
      # assembly — `dbdatasync version` reflects the assembly's own version, so a silently ignored
      # -p:Version would still print 0.1.0 and fail this step.
      #
      # --version "$SHIPPED", not left to float: --add-source only *adds* to the default sources
      # (nuget.org included, confirmed by `dotnet nuget list source`), and an unversioned
      # `dotnet tool install` considers only stable versions by design — which hides a -beta package
      # in the local artifacts feed exactly as it would on nuget.org itself, so a beta tag's smoke
      # test found nothing in either source without this. An explicit version bypasses that
      # restriction and is the stronger assertion anyway: it proves *this exact* computed version
      # installs, not merely that installing found something whose reported string happens to
      # contain it.
      - name: Install it into a clean tool root and check it reports the computed version
        env:
          SHIPPED: ${{ steps.pack.outputs.shipped }}
        run: |
          dotnet tool install --tool-path /tmp/dbdatasync-tool --add-source artifacts DbDataSync --version "$SHIPPED"
          reported=$(/tmp/dbdatasync-tool/dbdatasync version)
          echo "dbdatasync version said: $reported"
          case "$reported" in
            *"$SHIPPED"*) ;;
            *)
              echo "expected the packed version $SHIPPED in that output"
              exit 1
              ;;
          esac

      # Trusted Publishing (phase 127) — no NUGET_API_KEY secret exists anywhere in this repo. This
      # job's own OIDC identity (repo DbDataSync/DbDataSync, workflow release.yml) is what nuget.org's
      # Trusted Publishing policy checks; see phase-127-nuget-trusted-publishing.md for the one-time
      # policy setup on nuget.org's side, which nothing in this repo can do for itself.
      #
      # Requested here, immediately before the push that spends it, and not any earlier in the job:
      # the key nuget.org hands back is valid for one hour and good for exactly one push.
      - name: NuGet login (OIDC → a one-hour API key)
        uses: NuGet/login@v1
        id: nuget-login
        with:
          # The nuget.org profile name the Trusted Publishing policy is registered under — not an
          # email address. Not sensitive in itself; stored as a secret only because that's nuget.org's
          # own documented pattern, and there's no reason to diverge from a vendor's tested example
          # for a low-stakes value.
          user: ${{ secrets.NUGET_USER }}

      # Before the GitHub Release, not after: so that Release's own notes can say "published to
      # nuget.org" truthfully, rather than promising a step that hasn't run yet.
      #
      # steps.pack.outputs.nupkg by exact path, not artifacts/*.nupkg: this repo publishes the CLI
      # tool only (see the parent planning doc) — a bare glob would also push the incidental
      # DbDataSync.Drivers.Abstractions package the pack step's own comment explains, which is a real
      # scope violation, not a cosmetic one.
      - name: Push to nuget.org
        run: |
          dotnet nuget push "${{ steps.pack.outputs.nupkg }}" \
            --api-key "${{ steps.nuget-login.outputs.NUGET_API_KEY }}" \
            --source https://api.nuget.org/v3/index.json \
            --skip-duplicate

      # After the nuget.org push, not before: a tag is a claim that this version shipped, and it
      # should never exist for one that didn't. This is also *why* a failed run needs no tag cleanup
      # any more, unlike the tag-push-triggered shape this replaced — a run that fails anywhere above
      # this step simply leaves no trace at all, and a retry is just running the workflow again with a
      # freshly computed (and therefore always-unique) version, never a colliding tag to delete first.
      #
      # Lightweight, not annotated: an annotated tag needs a git author identity configured for
      # nothing this repo would use, since the one thing an annotation would carry — who, why — already
      # lives in the GitHub Release's own notes, the richer and more visible copy of the same
      # information. actions/checkout@v4's default persist-credentials is what makes a plain `git
      # push` here work with no further auth setup.
      - name: Tag this commit with the released version
        env:
          VERSION: ${{ steps.pack.outputs.shipped }}
        run: |
          git tag "$VERSION"
          git push origin "refs/tags/$VERSION"

      # The nupkg alone. ci.yml's package job builds a container image but only ever tags it
      # dbdatasync:ci locally and never pushes it to a registry, so there is no published image
      # reference a release could point at — attaching one would mean first deciding to publish
      # images somewhere, which is a separate call this phase does not make.
      - name: Publish the GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          VERSION: ${{ steps.pack.outputs.shipped }}
          PRERELEASE: ${{ steps.version.outputs.prerelease }}
          NUPKG: ${{ steps.pack.outputs.nupkg }}
        run: |
          # Built as a plain variable first, not inline in the heredoc below: the heredoc is unquoted
          # (so ${VERSION} etc. expand), which means a literal backtick anywhere in its body is live
          # command-substitution syntax to bash, not markdown code-formatting — every backtick in this
          # file is backslash-escaped for exactly that reason. A ${var} expansion's *value* is spliced
          # in as inert text with no such re-scanning, so building the one conditional, backtick-bearing
          # sentence as its own variable sidesteps the escaping problem entirely rather than fighting it
          # inside a heredoc-embedded command substitution.
          prerelease_note=""
          if [ "$PRERELEASE" = "true" ]; then
            prerelease_note='**This is a prerelease** — nuget.org will not surface it to a plain `dotnet tool install`; the exact `--version` below is required.'
          fi

          # A file rather than an inline --notes argument: the body is multi-line Markdown with
          # backticks and fences in it, and a heredoc keeps it readable here and out of the way of
          # the shell's quoting.
          cat > /tmp/release-notes.md <<EOF
          The \`dbdatasync\` .NET global tool, packed from \`${GITHUB_SHA}\` — a manual run of this
          workflow, which tagged that commit \`${VERSION}\` itself once this version was confirmed
          published.

          The version is the UTC date and time this release was built. ${prerelease_note}

          Published to nuget.org:

          \`\`\`
          dotnet tool install --global DbDataSync --version ${VERSION}
          \`\`\`

          The attached package is the same bits, for an offline or air-gapped install:

          \`\`\`
          dotnet tool install --global --add-source . DbDataSync --version ${VERSION}
          \`\`\`
          EOF
          prerelease_flag=()
          [ "$PRERELEASE" = "true" ] && prerelease_flag=(--prerelease)
          # "$VERSION" — the tag the previous step just pushed, not $GITHUB_REF_NAME (that's the
          # branch this run was dispatched against, e.g. "main"; there is no incoming tag any more).
          # The exact nupkg path, not artifacts/*.nupkg — same reason as the nuget.org push above:
          # "The nupkg alone" (this step's own comment) was always meant to be one file, not
          # incidentally two.
          gh release create "$VERSION" \
            --title "DbDataSync $VERSION" \
            --notes-file /tmp/release-notes.md \
            "${prerelease_flag[@]}" \
            "$NUPKG"
