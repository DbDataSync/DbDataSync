# The product, for somebody who wants to run it rather than develop it.
#
# Deliberately a second file: docker-compose.yml stands up the test databases this repo develops
# against, and folding the application into it would make "start my test databases" also start an
# application.
#
#   docker compose -f docker-compose.app.yml up
#
# This builds the image from this checkout. To run a published release instead, replace `build:` with
#   image: ghcr.io/dbdatasync/dbdatasync:latest
# (docs/install.md, "Running in a container", lists the tags; the image is published for amd64 and arm64).
services:
  dbdatasync:
    build:
      context: .
    container_name: dbdatasync
    ports:
      - "8080:8080"
    volumes:
      - dbdatasync-data:/var/lib/dbdatasync
    restart: unless-stopped

volumes:
  dbdatasync-data:
