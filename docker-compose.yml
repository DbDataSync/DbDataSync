services:
  # The tools path moved: images from 2025 onward ship /opt/mssql-tools18 only, and its sqlcmd defaults
  # to encrypted connections so it needs -C against the container's self-signed certificate. The health
  # checks try the new path first and fall back, so a machine holding an older pulled image keeps
  # working — which is not hypothetical, since `:2022-latest` moves under you.
  mssql-source:
    image: mcr.microsoft.com/mssql/server:2022-latest
    container_name: dbdatasync-mssql-source
    environment:
      ACCEPT_EULA: "Y"
      MSSQL_PID: Developer
      MSSQL_SA_PASSWORD: ${DBDATASYNC_MSSQL_SA_PASSWORD:-DbDataSync_Test_Pw1}
      # CDC's capture is a SQL Server Agent job, so without Agent `sp_cdc_enable_table` succeeds and
      # then nothing is ever captured — `fn_cdc_get_max_lsn()` stays null forever. The image ships
      # Agent but leaves it stopped, which made "the container has Agent" true and useless. Source
      # only: the target is written to, never captured from.
      MSSQL_AGENT_ENABLED: "true"

    ports:
      - "14330:1433"
    volumes:
      - mssql-source-data:/var/opt/mssql
    healthcheck:
      test: ["CMD-SHELL", "/opt/mssql-tools18/bin/sqlcmd -C -S localhost -U sa -P \"$$MSSQL_SA_PASSWORD\" -Q 'SELECT 1' || /opt/mssql-tools/bin/sqlcmd -S localhost -U sa -P \"$$MSSQL_SA_PASSWORD\" -Q 'SELECT 1' || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s

  mssql-target:
    image: mcr.microsoft.com/mssql/server:2022-latest
    container_name: dbdatasync-mssql-target
    environment:
      ACCEPT_EULA: "Y"
      MSSQL_PID: Developer
      MSSQL_SA_PASSWORD: ${DBDATASYNC_MSSQL_SA_PASSWORD:-DbDataSync_Test_Pw1}
    ports:
      - "14331:1433"
    volumes:
      - mssql-target-data:/var/opt/mssql
    healthcheck:
      test: ["CMD-SHELL", "/opt/mssql-tools18/bin/sqlcmd -C -S localhost -U sa -P \"$$MSSQL_SA_PASSWORD\" -Q 'SELECT 1' || /opt/mssql-tools/bin/sqlcmd -S localhost -U sa -P \"$$MSSQL_SA_PASSWORD\" -Q 'SELECT 1' || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s

  # Phase 34: built rather than pulled, because logical decoding needs the wal2json output plugin and
  # no well-known public image carries it any more (Debezium's, the usual answer, builds only
  # decoderbufs as of 3.x). See docker/postgres-logical/Dockerfile.
  postgres:
    build:
      context: ./docker/postgres-logical
    image: dbdatasync-postgres-logical:17
    container_name: dbdatasync-postgres
    # wal_level=logical is what lets a replication slot decode anything at all, and it is a
    # restart-requiring setting on a real server — which is the single biggest adoption obstacle this
    # mechanism has, and the reason the provisioner checks it before proposing a slot rather than
    # letting slot creation fail with the server's own wording.
    #
    # max_replication_slots defaults to 10. Phase 34's slots are one per source table, not one per
    # replication (see PgLogicalSlotReader on why a shared slot cannot be advanced safely), so the
    # default is a low ceiling for anything but a toy replication. Raised here so the dev loop does
    # not hit it; on a real server it is a restart-requiring setting too.
    command:
      - postgres
      - -c
      - wal_level=logical
      - -c
      # Since PostgreSQL 18.6/17.11/16.15/15.19/14.24 (the fix for CVE-2026-6471), an output plugin
      # library has to be listed here before a slot may use it — the default is only the two that ship
      # with Postgres. Without it, creating a slot fails with `library "wal2json" may not be used as an
      # output plugin`, which is not a phrase that leads anywhere obvious. A real deployment needs this
      # too; PostgresProvisioner checks for it before proposing a slot.
      - output_plugin_libraries=pgoutput,test_decoding,wal2json
      - -c
      - max_replication_slots=20
      - -c
      - max_wal_senders=20
    environment:
      POSTGRES_PASSWORD: ${DBDATASYNC_POSTGRES_PASSWORD:-DbDataSync_Test_Pw1}
      POSTGRES_USER: dbdatasync
      POSTGRES_DB: dbdatasync
    ports:
      - "15432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U dbdatasync"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s

  # Originally stood up for phase 109c's proof that a provider restored by `dbdatasync provider
  # install` (MySqlConnector, here) opens a real connection with no compile-time dependency anywhere
  # in the solution — that is no longer true as of phase 147, which added DbDataSync.Drivers.MySql as
  # a genuine compiled driver project, and this container now backs its own test suite too.
  mysql:
    image: mysql:9
    container_name: dbdatasync-mysql
    environment:
      MYSQL_ROOT_PASSWORD: ${DBDATASYNC_MYSQL_ROOT_PASSWORD:-DbDataSync_Test_Pw1}
      MYSQL_DATABASE: dbdatasync
    ports:
      - "13306:3306"
    volumes:
      - mysql-data:/var/lib/mysql
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h localhost -uroot -p$$MYSQL_ROOT_PASSWORD"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s

  # Phase 147: proves the trigger-audit DDL is genuinely identical across both forks (see
  # change-tracking-mysql-and-mariadb-triggers.md) rather than assumed — TriggerAuditReaderTests runs
  # against this container too, not only mysql above.
  mariadb:
    image: mariadb:11
    container_name: dbdatasync-mariadb
    environment:
      MARIADB_ROOT_PASSWORD: ${DBDATASYNC_MARIADB_ROOT_PASSWORD:-DbDataSync_Test_Pw1}
      MARIADB_DATABASE: dbdatasync
    ports:
      - "13307:3306"
    volumes:
      - mariadb-data:/var/lib/mysql
    healthcheck:
      test: ["CMD-SHELL", "healthcheck.sh --connect --innodb_initialized"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s

  # Phase 148. gvenzl/oracle-free — the realistic modern free, unauthenticated option named in the
  # phase doc: Oracle's own official images require accepting a license and are not on a registry CI
  # can pull from without authentication. docker/oracle-init/10-grants.sql (mounted below) grants the
  # one privilege OracleFlashbackReader needs beyond ordinary CONNECT, automatically, on first start.
  oracle:
    image: gvenzl/oracle-free:23-slim
    container_name: dbdatasync-oracle
    environment:
      ORACLE_PASSWORD: ${DBDATASYNC_ORACLE_PASSWORD:-DbDataSync_Test_Pw1}
      APP_USER: dbdatasync
      APP_USER_PASSWORD: ${DBDATASYNC_ORACLE_APP_PASSWORD:-DbDataSync_Test_Pw1}
    ports:
      - "15210:1521"
    volumes:
      - oracle-data:/opt/oracle/oradata
      - ./docker/oracle-init:/container-entrypoint-initdb.d
    healthcheck:
      test: ["CMD", "healthcheck.sh"]
      interval: 10s
      timeout: 10s
      retries: 20
      start_period: 120s

volumes:
  mssql-source-data:
  mssql-target-data:
  postgres-data:
  mysql-data:
  mariadb-data:
  oracle-data:
