<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" width="32" height="32">
  <!-- The same glyph the app shows in its rail (see LogoIcon in src/components/icons.tsx), on the
       same accent square (.rail-mark, --accent #0f7a55). Kept in step by hand: this file changes when
       that component does, and there are only two of them.

       Drawn a little heavier than the rail's version — stroke 2.6 rather than 2 — because a favicon is
       read at 16px, where a hairline stroke disappears into the tab bar. -->
  <rect width="32" height="32" rx="7" fill="#0f7a55"/>
  <g transform="translate(5 5) scale(0.9167)" fill="none" stroke="#fff" stroke-width="2.6"
     stroke-linecap="round" stroke-linejoin="round">
    <path d="M3 2v6h6"/>
    <path d="M21 12A9 9 0 0 0 6 5.3L3 8"/>
    <path d="M21 22v-6h-6"/>
    <path d="M3 12a9 9 0 0 0 15 6.7l3-2.7"/>
    <circle cx="12" cy="12" r="1"/>
  </g>
</svg>
