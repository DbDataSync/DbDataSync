dialect:
  quoteIdentifier: backtick        # backtick | doubleQuote | bracket
  parameterPrefix: "@"             # "@" -> @p , ":" -> :p , "?" -> positional
  rowLimit: limitOffset            # limitOffset (LIMIT n) | offsetFetch (FETCH FIRST n ROWS ...) |
                                    # topN (TOP (n) ... at the front, SQL-Server/Sybase-style)
  # supportsTieSafeRowLimit: false  # whether a bounded read's WITH TIES guarantee (no row sharing the
                                    # boundary value ever split across passes) is real for this engine.
                                    # Omitted means the row-limit style's own conventional answer: false
                                    # for limitOffset (no engine here has a tie-safe LIMIT), true for
                                    # offsetFetch/topN. Set explicitly only to state a real exception —
                                    # this engine (MySQL/MariaDB) has none, so it's left at the default.
  # catalog: query                 # uncomment (+ a metadataQueries block below) if information_schema
                                    # doesn't fit this engine — omitted means the base's own default
                                    # (information_schema for the ADO.NET generic driver, this one)
  supportsChangeDatabase: true     # false -> a mapping naming another database is a config error
  defaultDatabase: ""              # what to connect to before a mapping names one
  # connectionStringKeys:          # uncomment and edit if this library's key names differ
  #   host: Server
  #   port: Port
  #   database: Database
  #   username: User Id
  #   password: Password
  #   connectTimeout: Connection Timeout

# Native type name (with its (p,s) args) -> canonical. Anything unlisted -> Unmappable,
# which provisioning reports as unsupported rather than guessing a rendering.
typeMap:
  tinyint:        Int8
  smallint:       Int16
  int:            Int32
  bigint:         Int64
  "decimal(p,s)": { kind: Decimal, precision: p, scale: s }
  double:         Double
  "varchar(n)":   { kind: String, length: n, unicode: true }
  text:           { kind: String, max: true }
  datetime:       Timestamp
  date:           Date
  json:           Json
  blob:           { kind: Binary, max: true }

# Engine-neutral strategies to offer. All already exist in DbDataSync.Drivers.Generic.
capabilities:
  readers: [Watermark, BatchReload]
  staging: [StagingTable]
  writers: [DeleteInsert]
